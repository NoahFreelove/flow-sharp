name: Release flow CLI

# Tag-driven release. Builds the 5-RID self-contained `flow` binaries via
# scripts/publish.sh (linux-x64/arm64, osx-x64/arm64, win-x64), then publishes
# every archive + .sha256 sidecar to a GitHub Release.
#
# TRIGGER POLICY: pushed v* tags ONLY. Nothing builds on push/PR/dispatch.
# Tag creation is admin-protected by a repository ruleset, so only the
# owner/admins can cut a release. A hyphenated tag (e.g. v1.5.0-rc1) publishes
# a prerelease for dry-runs; a clean tag (v1.5.0) publishes a full release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # gh release create writes to Releases

jobs:
  release:
    name: Build + publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure zip is present (win-x64 packaging)
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Build + package all 5 RIDs
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/publish.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          assets=$(ls \
            publish/flow-*-"$TAG".tar.gz \
            publish/flow-*-"$TAG".zip \
            publish/flow-*-"$TAG".tar.gz.sha256 \
            publish/flow-*-"$TAG".zip.sha256 2>/dev/null)
          test -n "$assets" || { echo "No release assets matched for $TAG" >&2; exit 1; }
          gh release create "$TAG" $assets \
            --title "Flow $TAG" \
            --generate-notes \
            $prerelease
